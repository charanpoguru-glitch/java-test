<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Professional Assessment</title>
    <style>
        :root {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --border-color: #cbd5e1;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --code-bg: #f8fafc;
            --code-border: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease;
        }

        /* Full Page Red Blink Alert Animation */
        @keyframes pageRedBlink {
            0% { background-color: var(--bg-base); }
            50% { background-color: #fee2e2; }
            100% { background-color: var(--bg-base); }
        }

        .blink-alert {
            animation: pageRedBlink 0.6s ease-in-out 2;
        }

        .exam-container {
            width: 100%;
            max-width: 820px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .exam-header {
            background: #ffffff;
            padding: 22px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .progress-indicator {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .timer-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .timer-green {
            background: #dcfce7;
            color: #166534;
            border-color: #bbf7d0;
        }

        .timer-red {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        .exam-body {
            padding: 28px;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #0f172a;
            line-height: 1.5;
        }

        /* Highlighted Code Window */
        .code-window {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 22px;
            overflow-x: auto;
        }

        .code-window pre {
            margin: 0;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            font-size: 0.95rem;
            color: #24292f;
            line-height: 1.6;
            white-space: pre;
        }

        /* Syntax Highlighter Classes */
        .tok-keyword { color: #d73a49; font-weight: bold; }  /* red/crimson */
        .tok-type { color: #6f42c1; font-weight: bold; }     /* purple */
        .tok-string { color: #0a7337; }                      /* green */
        .tok-number { color: #005cc5; }                      /* blue */
        .tok-comment { color: #6e7781; font-style: italic; } /* gray */
        .tok-method { color: #b05a00; }                      /* amber/brown */

        .editor-container {
            margin-bottom: 22px;
        }

        .editor-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            color: var(--text-main);
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .exam-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-left: auto;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #cbd5e1;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Review Screen Styles */
        #reviewScreen {
            display: none;
            padding: 28px;
        }

        .review-header {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #0f172a;
        }

        .review-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 22px;
            margin-bottom: 22px;
        }

        .review-card h4 {
            margin: 0 0 10px 0;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .user-ans-box {
            margin-bottom: 16px;
        }

        .user-ans {
            color: #334155;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-top: 6px;
            white-space: pre-wrap;
        }

        .correct-ans {
            color: #166534;
            font-size: 0.95rem;
            line-height: 1.6;
            background: #dcfce7;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #bbf7d0;
            margin-top: 6px;
        }
    </style>
</head>
<body id="pageBody">

    <div class="exam-container" id="mainContainer">
        <!-- Exam Active Screen -->
        <div id="activeExam">
            <div class="exam-header">
                <span class="progress-indicator" id="progressText">Question 1 of 4</span>
                <div class="timer-badge timer-green" id="timer">03:00</div>
            </div>

            <div class="exam-body">
                <div class="question-title" id="questionTitle">Loading question...</div>
                
                <div class="code-window">
                    <pre><code id="codeSnippet"></code></pre>
                </div>

                <div class="editor-container">
                    <label class="editor-label" for="userAnswer">Your Analysis / Answer:</label>
                    <textarea id="userAnswer" placeholder="Type your answer or code explanation here..."></textarea>
                </div>

                <div class="exam-footer">
                    <button class="btn-secondary" id="btnPrev" onclick="handlePrev()" disabled>&larr; Previous</button>
                    <div class="btn-group">
                        <button class="btn-primary" id="btnNext" onclick="handleNext()">Next Question &rarr;</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step-by-Step Review Screen -->
        <div id="reviewScreen">
            <div class="review-header">Assessment Review</div>
            <p style="color: var(--text-muted); margin-bottom: 22px; font-size: 0.95rem;">Reviewing your answers question by question with easy, clear explanations:</p>
            
            <div id="reviewContent"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
                <button class="btn-secondary" id="reviewPrev" onclick="changeReviewStep(-1)">&larr; Previous Question</button>
                <span id="reviewProgress" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;">Question 1 of 4</span>
                <button class="btn-primary" id="reviewNext" onclick="changeReviewStep(1)">Next Question &rarr;</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                title: "Snippet 1: Loops & Arrays",
                prompt: "What is the final value printed for `sum`?",
                code: `int[] nums = {2, 4, 6, 8, 10};
int sum = 0;

for (int i = 0; i < nums.length; i++) {
    if (i % 2 == 0) {
        sum += nums[i];
    } else {
        sum -= nums[i];
    }
}
System.out.println(sum);`,
                correct: "Final Answer: 6\n\nEasy Explanation:\n• Index 0 (Even): sum = 0 + 2 = 2\n• Index 1 (Odd): sum = 2 - 4 = -2\n• Index 2 (Even): sum = -2 + 6 = 4\n• Index 3 (Odd): sum = 4 - 8 = -4\n• Index 4 (Even): sum = -4 + 10 = 6"
            },
            {
                title: "Snippet 2: Strings & Methods",
                prompt: "What does `System.out.println(text)` output, and why?",
                code: `public static void main(String[] args) {
    String text = "Java";
    changeText(text);
    System.out.println(text);
}

public static void changeText(String t) {
    t = t.concat(" Programming");
}`,
                correct: "Final Output: \"Java\"\n\nEasy Explanation:\n1. Java is strictly Pass-by-Value (it passes a copy of the reference).\n2. Strings are Immutable (they cannot be changed once created).\n3. Inside the method, 't' points to a brand new string (\"Java Programming\"), but the original 'text' variable back in main remains completely untouched."
            },
            {
                title: "Snippet 3: Array Processing (Debugging)",
                prompt: "What two major bugs exist in this loop meant to find the maximum score?",
                code: `int[] scores = {85, 92, 78, 95, 88};
int max = 0;

for (int i = 1; i <= scores.length; i++) {
    if (scores[i] > max) {
        max = scores[i];
    }
}
System.out.println("Max score: " + max);`,
                correct: "Bugs Found & Fixes:\n1. ArrayIndexOutOfBoundsException: The condition 'i <= scores.length' tries to access index 5, which doesn't exist (valid indices are 0 to 4). Fix it to 'i < scores.length'.\n2. Skips the First Element: Starting at 'i = 1' completely ignores the first score (scores[0] = 85). Fix it to start at 'i = 0'."
            },
            {
                title: "Snippet 4: String Comparison (Debugging)",
                prompt: "Why is this condition failing even when typing the correct password, and how should it be fixed?",
                code: `String correctPassword = "secret123";
String userInput = "secret123"; // simulated input

if (correctPassword == userInput) {
    System.out.println("Access Granted");
} else {
    System.out.println("Access Denied");
}`,
                correct: "Why it fails:\nThe '==' operator in Java checks if two string variables point to the exact same memory address (reference equality), NOT whether their letters match.\n\nHow to fix it:\nAlways use the '.equals()' method to compare text contents:\nif (correctPassword.equals(userInput))"
            }
        ];

        // Lightweight Java Syntax Highlighter
        function highlightJava(code) {
            const regex = /(\/\/[^\n]*)|("(?:\\.|[^"\\])*")|\b(public|static|void|int|for|if|else|return|new|boolean|char|double|float)\b|\b(String|System|out)\b|\b(\d+)\b|\b([a-zA-Z_]\w*)(?=\s*\()/g;
            let result = "";
            let lastIndex = 0;
            let match;
            
            while ((match = regex.exec(code)) !== null) {
                result += escapeHtml(code.substring(lastIndex, match.index));
                
                if (match[1]) {
                    result += `<span class="tok-comment">${escapeHtml(match[1])}</span>`;
                } else if (match[2]) {
                    result += `<span class="tok-string">${escapeHtml(match[2])}</span>`;
                } else if (match[3]) {
                    result += `<span class="tok-keyword">${match[3]}</span>`;
                } else if (match[4]) {
                    result += `<span class="tok-type">${match[4]}</span>`;
                } else if (match[5]) {
                    result += `<span class="tok-number">${match[5]}</span>`;
                } else if (match[6]) {
                    result += `<span class="tok-method">${escapeHtml(match[6])}</span>`;
                }
                lastIndex = regex.lastIndex;
            }
            result += escapeHtml(code.substring(lastIndex));
            return result;
        }

        let currentIdx = 0;
        let timer;
        let timeLeft = 180; // 3 minutes per question
        let hasBlinked = false;
        const userResponses = new Array(questions.length).fill("");
        let reviewIdx = 0;

        function startTimer() {
            clearInterval(timer);
            timeLeft = 180;
            hasBlinked = false;
            updateTimerDisplay();

            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                // Trigger 2-time red page blink at exactly 1 minute left
                if (timeLeft === 60 && !hasBlinked) {
                    hasBlinked = true;
                    triggerBlinkEffect();
                }

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    autoAdvance();
                }
            }, 1000);
        }

        function triggerBlinkEffect() {
            const bodyEl = document.getElementById('pageBody');
            bodyEl.classList.add('blink-alert');
            setTimeout(() => {
                bodyEl.classList.remove('blink-alert');
            }, 1200);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            const timerEl = document.getElementById('timer');
            timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeLeft < 60) {
                timerEl.className = "timer-badge timer-red";
            } else {
                timerEl.className = "timer-badge timer-green";
            }
        }

        function saveCurrentAnswer() {
            const ans = document.getElementById('userAnswer').value.trim();
            userResponses[currentIdx] = ans;
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            document.getElementById('progressText').textContent = `Question ${currentIdx + 1} of ${questions.length}`;
            document.getElementById('questionTitle').textContent = q.prompt;
            
            // Render syntax-highlighted code
            document.getElementById('codeSnippet').innerHTML = highlightJava(q.code);
            document.getElementById('userAnswer').value = userResponses[currentIdx] || "";
            
            document.getElementById('btnPrev').disabled = (currentIdx === 0);
            const nextBtn = document.getElementById('btnNext');
            if (currentIdx === questions.length - 1) {
                nextBtn.textContent = "Submit Exam \u2713";
            } else {
                nextBtn.textContent = "Next Question \u2192";
            }

            startTimer();
        }

        function handleNext() {
            saveCurrentAnswer();
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                clearInterval(timer);
                showReviewScreen();
            }
        }

        function handlePrev() {
            saveCurrentAnswer();
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function autoAdvance() {
            saveCurrentAnswer();
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showReviewScreen();
            }
        }

        function showReviewScreen() {
            document.getElementById('activeExam').style.display = 'none';
            document.getElementById('reviewScreen').style.display = 'block';
            reviewIdx = 0;
            renderReviewCard();
        }

        function renderReviewCard() {
            const q = questions[reviewIdx];
            const userAns = userResponses[reviewIdx] || "[No answer provided]";

            let html = `
                <div class="review-card">
                    <h4>${q.title}</h4>
                    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;"><strong>Prompt:</strong> ${q.prompt}</div>
                    
                    <div class="user-ans-box">
                        <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">Your Submission:</span>
                        <div class="user-ans">${escapeHtml(userAns)}</div>
                    </div>

                    <div class="user-ans-box" style="margin-bottom: 0;">
                        <span style="font-size: 0.85rem; color: #166534; font-weight: 700;">Reference Solution & Explanation:</span>
                        <div class="correct-ans">${q.correct.replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
            `;

            document.getElementById('reviewContent').innerHTML = html;
            document.getElementById('reviewProgress').textContent = `Question ${reviewIdx + 1} of ${questions.length}`;
            
            document.getElementById('reviewPrev').disabled = (reviewIdx === 0);
            document.getElementById('reviewNext').disabled = (reviewIdx === questions.length - 1);
        }

        function changeReviewStep(direction) {
            reviewIdx += direction;
            if (reviewIdx < 0) reviewIdx = 0;
            if (reviewIdx >= questions.length) reviewIdx = questions.length - 1;
            renderReviewCard();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initialize on load
        window.onload = loadQuestion;
    </script>
</body>
</html>
